name: IRIS Pipeline Sanity Test

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install scikit-learn
          pip install pytest

      - name: Run tests and generate report
        run: |
          echo "## ✅ IRIS Test Report" > report.md
          pytest tests/ >> report.md

      - name: Post test results as comment
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment report.md
